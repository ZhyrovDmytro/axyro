name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PLANNER_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: test-only-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint -- --max-warnings=0
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - name: Test shared quota migration and permissions
        env:
          QUOTA_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$QUOTA_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          docker exec -i "$QUOTA_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261117092915_api_rate_limits.sql
          docker exec -i "$QUOTA_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < tests/security/rate-limit.sql
      - name: Verify concurrent quota consumption
        env:
          QUOTA_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          quota_pids=()
          for attempt in {1..20}; do
            docker exec "$QUOTA_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -Atc "set role service_role; select public.consume_api_rate_limit('planner:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc', 3, 900);" > "$RUNNER_TEMP/quota-$attempt" &
            quota_pids+=("$!")
          done
          for quota_pid in "${quota_pids[@]}"; do wait "$quota_pid"; done
          test "$(cat "$RUNNER_TEMP"/quota-* | awk '$0 == "0" { n++ } END { print n+0 }')" = 3
      - name: Test billing migration and service-only access
        env:
          BILLING_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$BILLING_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123090000_billing_withdrawals.sql
          docker exec -i "$BILLING_DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < tests/security/billing-withdrawals.sql
      - run: npm audit --audit-level=high
      - run: npm run build -- --webpack
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
