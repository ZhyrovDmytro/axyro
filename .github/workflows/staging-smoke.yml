name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed staging HTTPS origin
        required: true
        default: https://axyro-training.netlify.app

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.release.config.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
