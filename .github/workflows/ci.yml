name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PLANNER_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint -- --max-warnings=0
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build -- --webpack
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
